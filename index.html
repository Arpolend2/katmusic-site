<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>КатМузыка</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #101927; color: #eef4fc; }
    main { width: min(100%, 38rem); padding: clamp(1.5rem, 5vw, 3rem); background: #1b2b40; border: 1px solid #3a506b; border-radius: 1.25rem; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 7vw, 3rem); }
    p { line-height: 1.6; color: #c9d6e5; }
  </style>
</head>
<body>
  <main>
    <h1>КатМузыка</h1>
    <p>Проект музыкального приложения для ОС Аврора.</p>
    <p>Эта страница используется при регистрации приложения в VK ID.</p>
  </main>
</body>
</html>
